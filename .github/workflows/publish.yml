name: Publish Flutter bot image
on:
  push:
    branches: [main]
    paths:
      - sdk/**
      - scripts/**
      - versions.yml
      - .github/workflows/ci.yml
      - .github/workflows/publish.yml
  schedule:
    # Every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      increase-type:
        type: choice
        description: Version increase (MAJOR.MINOR.PATCH); NONE releases the current version
        options:
          - patch
          - minor
          - major
          - NONE
        default: NONE
      auto-increase:
        type: boolean
        description: Carry patch and minor at 10 (1.0.9 becomes 1.1.0; 1.9.9 becomes 2.0.0)
        default: true

permissions:
  contents: read

concurrency:
  group: publish-flutter-bot
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.base.outputs.digest }}
      should_run: ${{ steps.base.outputs.should_run }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Check Flutter base before validation
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/stone-soup-tech/flutter:latest --format '{{.Manifest.Digest}}')
          python3 scripts/base_image.py "$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == 'schedule' ]] && git diff --quiet -- versions.yml; then
            echo 'Flutter base is unchanged; skipping validation and publication.'
            echo 'should_run=false' >> "$GITHUB_OUTPUT"
          else
            echo 'should_run=true' >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    uses: ./.github/workflows/ci.yml
    with:
      flutter-image: ghcr.io/stone-soup-tech/flutter@${{ needs.preflight.outputs.digest }}
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [preflight, checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Check release commit
        run: |
          git fetch origin main
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
            echo '::error::main has advanced. Run publishing again on its latest commit.'
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Record validated Flutter base image
        id: base
        env:
          DIGEST: ${{ needs.preflight.outputs.digest }}
        run: |
          python3 scripts/base_image.py "$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Prepare image version and repository
        id: image
        env:
          INCREASE_TYPE: ${{ inputs.increase-type || 'NONE' }}
          AUTO_INCREASE: ${{ github.event_name != 'workflow_dispatch' || inputs.auto-increase }}
        run: |
          if [[ "${{ steps.base.outputs.changed }}" == 'true' && "$INCREASE_TYPE" == 'NONE' ]]; then
            INCREASE_TYPE=patch
          fi
          version=$(python3 scripts/image_version.py "$INCREASE_TYPE" --auto-increase "$AUTO_INCREASE")
          image="ghcr.io/stone-soup-tech/flutter-bot"
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether the release image is already published
        id: release
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if output=$(docker buildx imagetools inspect "$IMAGE:$VERSION" 2>&1); then
            echo "::notice::Image $IMAGE:$VERSION is already published. No image will be published; existing release tags and latest remain unchanged. To publish new changes, increment image_version in versions.yml."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -Eiq 'manifest unknown|not found|no such manifest' <<< "$output"; then
            echo '::error::Could not establish whether the image exists. Refusing publication.'
            exit 1
          fi
          echo "should_publish=true" >> "$GITHUB_OUTPUT"

      - name: Save increased image version
        if: steps.release.outputs.should_publish == 'true'
        id: source
        env:
          INCREASE_TYPE: ${{ inputs.increase-type || 'NONE' }}
          VERSION: ${{ steps.image.outputs.version }}
        run: |
          if ! git diff --quiet -- versions.yml; then
            git fetch origin main
            if [[ "$(git rev-parse HEAD)" != "$(git rev-parse FETCH_HEAD)" ]]; then
              echo '::error::main changed while preparing the release. Run publishing again.'
              exit 1
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add versions.yml
            git commit -m "chore: bump image version to $VERSION"
            git push origin HEAD:refs/heads/main
          fi
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        if: steps.release.outputs.should_publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sdk/Dockerfile
          platforms: linux/amd64
          pull: true
          build-args: |
            FLUTTER_IMAGE=ghcr.io/stone-soup-tech/flutter@${{ steps.base.outputs.digest }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.revision }}
